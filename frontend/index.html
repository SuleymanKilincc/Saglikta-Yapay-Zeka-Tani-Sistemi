<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI X-Ray Tanı Sistemi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🩺 AI X-Ray Analiz Sistemi</h1>
            <p>Lütfen hastanın bilgilerini ve röntgen görüntüsünü sisteme girin.</p>
        </header>
        <main>
            <div class="upload-section">
                <input type="text" id="patient-name" placeholder="Hasta Adı ve Soyadı">
                <input type="file" id="xray-upload" accept="image/jpeg, image/png, .dcm">
                <button id="analyze-btn" onclick="analizBaslat()">🚀 Analiz Et</button>
            </div>
            <div id="loading" class="hidden">Yapay Zeka modeli görüntüleri işliyor, lütfen bekleyin...</div>
            <div id="result-section" class="hidden">
                <h2>📊 Teşhis Sonucu</h2>
                <div id="result-content"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
